<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Redaction+50:ital,wght@0,400;0,700;1,400&display=swap');
        body{
            background-image: url(images/gallery/bgg.gif);
            background-size: cover;
            font-family:"Redaction 50", serif;
        }

        header {
            background: transparent;
            color: white;
            text-align: center;
            margin: none;
            padding: 10px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            padding-right: 40px;
            padding-left: 20px;
        }

        .pictures {
            position: relative;
            height: 0;
            padding-bottom: 100%;
            border-radius: 10px;
        }

        .pictures img {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            object-fit: cover;
        }

        p {
            font-size: 18px;
            max-width: 600px;
            margin: 20px auto;
        }

        footer {
            background: transparent;
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            position: fixed;
            bottom: 0;
            margin-left: 8px;
            width: 95%;       
            }

        

        .menu a {
            display: flex;
            flex-direction: row-reverse;
            flex-wrap: wrap-reverse;
            justify-content: center;
            align-content: space-between;
            color: white;
            float: left;
            margin-left: 100px;
            margin-right: 60px;

        }

        .menu a:hover {
            transition: transform 1s infinite;
            transform: scale(1.1, 1.3);
        }
    </style>

</head>

<body>

    <header>
        <h1>Gallery</h1>
    </header>

    <main>
        <div class="gallery">

            <div class="pictures">
                <img src="images/gallery/pic1.png" alt="Picture 1">
            </div>

            <div class="pictures">
                <img src="images/gallery//pic2.png" alt="Picture 2">
            </div>

            <div class="pictures">
                <img src="images/gallery//pic3.png" alt="Picture 3">
            </div>

            <div class="pictures">
                <img src="images/gallery//pic4.png" alt="Picture 4">
            </div>

            <div class="pictures">
                <img src="images/gallery//pic5.png" alt="Picture 5">
            </div>

            <div class="pictures">
                <img src="images/gallery//pic6.png" alt="Picture 6">
            </div>

            <div class="pictures">
                <img src="images/gallery//pic7.png" alt="Picture 7">
            </div>

            <div class="pictures">
                <img src="images/gallery//pic8.png" alt="Picture 8">
            </div>

        </div>
    </main>

    <footer>
        <div class="menu">
            <a href="home.html" target="contentFrame">Home</a>
            <a href="aboutme.html" target="contentFrame">About My Self</a>
            <a href="gallery.html" target="contentFrame">Gallery</a>
            <a href="contact.html" target="contentFrame">Contact</a>
        </div>

    </footer>

</body>
</html>
